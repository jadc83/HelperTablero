name: Compilar Instalador Linux (.deb y .AppImage)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri-linux:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: ./AdenOscuraTablero

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AdenOscuraTablero/package-lock.json

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependencias de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "AdenOscuraTablero/src-tauri"

      - name: Instalar dependencias del sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@v2

      - name: Compilar instalador Linux
        run: tauri build

      - name: Publicar instalador Linux
        uses: actions/upload-artifact@v4
        with:
          name: AdenOscuraTablero-Linux-Bundle
          path: |
            AdenOscuraTablero/src-tauri/target/release/bundle/deb/*.deb
            AdenOscuraTablero/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
